<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Session 四阶段会话流程</title>
  <desc id="desc">依次确认工作目录、检查本机状态、选择新建或继续会话，最后结合会话信息与项目实际状态核验结果。</desc>

  <rect width="1200" height="520" rx="28" fill="#07111F"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <g id="heading" transform="translate(60 52)">
      <text x="0" y="0" fill="#7DD3FC" font-size="18" font-weight="700" letter-spacing="2.4">SESSION ROUTE · 04 STAGES</text>
      <text x="0" y="51" fill="#F8FAFC" font-size="44" font-weight="760" letter-spacing="-1">一次会话，四个阶段</text>
      <text x="1080" y="48" text-anchor="end" fill="#94A3B8" font-size="21">准确定位 · 明确选择 · 独立核验</text>
    </g>

    <g id="route" transform="translate(60 142)">
      <path d="M20 20 H1060" fill="none" stroke="#2A4358" stroke-width="2"/>
      <path d="M237 14 L247 20 L237 26" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M502 14 L512 20 L502 26" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M822 14 L832 20 L822 26" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="20" cy="20" r="8" fill="#38BDF8"/>
      <circle cx="285" cy="20" r="8" fill="#38BDF8"/>
      <circle cx="550" cy="20" r="8" fill="#38BDF8"/>
      <circle cx="870" cy="20" r="8" fill="#34D399"/>
      <circle cx="1060" cy="20" r="8" fill="#34D399"/>

      <path d="M265 58 V266" stroke="#1F3548"/>
      <path d="M530 58 V266" stroke="#1F3548"/>
      <path d="M850 58 V266" stroke="#1F3548"/>

      <g id="stage-one" transform="translate(18 66)">
        <text x="0" y="64" fill="#17334A" font-size="76" font-weight="800">01</text>
        <text x="0" y="106" fill="#F8FAFC" font-size="31" font-weight="720">确认工作目录</text>
        <text x="0" y="143" fill="#94A3B8" font-size="21">明确项目所在位置</text>
        <g transform="translate(0 177)">
          <path d="M2 7 H28 L35 15 H72 V51 H2Z" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
          <text x="88" y="32" fill="#7DD3FC" font-size="22" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--dir</text>
        </g>
      </g>

      <g id="stage-two" transform="translate(283 66)">
        <text x="0" y="64" fill="#17334A" font-size="76" font-weight="800">02</text>
        <text x="0" y="106" fill="#F8FAFC" font-size="31" font-weight="720">检查本机状态</text>
        <text x="0" y="143" fill="#94A3B8" font-size="21">CLI 与会话信息</text>
        <text x="0" y="191" fill="#7DD3FC" font-size="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">version · doctor</text>
        <text x="0" y="222" fill="#7DD3FC" font-size="20" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">model · sessions</text>
      </g>

      <g id="stage-three" transform="translate(548 66)">
        <text x="0" y="64" fill="#17334A" font-size="76" font-weight="800">03</text>
        <text x="0" y="106" fill="#F8FAFC" font-size="31" font-weight="720">选择会话路径</text>
        <text x="0" y="143" fill="#94A3B8" font-size="21">新任务或准确恢复</text>

        <g transform="translate(0 166)">
          <path d="M0 0 H270" stroke="#245A75"/>
          <path d="M0 0 V46" stroke="#38BDF8" stroke-width="5"/>
          <text x="18" y="29" fill="#E0F2FE" font-size="22" font-weight="700">新建</text>
          <text x="88" y="29" fill="#7DD3FC" font-size="20">readonly / build</text>
        </g>
        <g transform="translate(0 226)">
          <path d="M0 0 H270" stroke="#256555"/>
          <path d="M0 0 V46" stroke="#34D399" stroke-width="5"/>
          <text x="18" y="29" fill="#D1FAE5" font-size="22" font-weight="700">继续</text>
          <text x="88" y="29" fill="#6EE7B7" font-size="20">exact ID + dir</text>
        </g>
      </g>

      <g id="stage-four" transform="translate(868 66)">
        <text x="0" y="64" fill="#174039" font-size="76" font-weight="800">04</text>
        <text x="0" y="106" fill="#F8FAFC" font-size="31" font-weight="720">核验实际结果</text>
        <text x="0" y="143" fill="#94A3B8" font-size="21">会话信息只是依据之一</text>
        <g transform="translate(0 174)" fill="#A7F3D0" font-size="20">
          <circle cx="5" cy="-6" r="4" fill="#34D399"/>
          <text x="19" y="0">文件差异</text>
          <circle cx="5" cy="31" r="4" fill="#34D399"/>
          <text x="19" y="37">测试与构建</text>
          <circle cx="5" cy="68" r="4" fill="#34D399"/>
          <text x="19" y="74">服务或页面状态</text>
        </g>
      </g>
    </g>

    <g id="footer-strip" transform="translate(60 460)">
      <path d="M0 0 H1080" stroke="#20384C"/>
      <text x="0" y="32" fill="#64748B" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">WORKDIR</text>
      <text x="142" y="32" fill="#64748B" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">STATUS</text>
      <text x="268" y="32" fill="#64748B" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">INVOKE / RESUME</text>
      <text x="474" y="32" fill="#64748B" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">INSPECT</text>
      <text x="1080" y="32" text-anchor="end" fill="#34D399" font-size="18" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">VERIFY PROJECT STATE</text>
    </g>
  </g>
</svg>
