      <circle cx="344" cy="164" r="9" fill="#FF6B45"/><text x="344" y="202" fill="#CBD5E1">exact session</text>
    </g>
    <text x="197" y="246" text-anchor="middle" fill="#FFB18F" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">STATUS · INVOKE · RESUME · FORK</text>
