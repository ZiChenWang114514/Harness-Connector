    <text x="0" y="68" fill="#FF6B45" font-size="59" font-weight="760">Pi</text>
    <text x="0" y="124" fill="#CBD5E1" font-size="25">Send work from any compatible harness.</text>
    <text x="0" y="160" fill="#CBD5E1" font-size="25">Keep the exact workspace, model, and session.</text>
  </g>
  <g transform="translate(748 105)">
