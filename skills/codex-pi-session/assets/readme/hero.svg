<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Any-to-Pi</title>
  <desc id="desc">Route work from any compatible coding harness to an exact Pi session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B12"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFB18F"/><stop offset="1" stop-color="#FF6B45"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <path d="M0 78H1200M706 78V420" stroke="#273244"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
    <circle cx="58" cy="39" r="6" fill="#FF6B45"/><text x="76" y="46" fill="#9CA3AF">ANY-TO HARNESS ADAPTER</text>
    <text x="1140" y="46" text-anchor="end" fill="#FFB18F">OPENAI · GPT-5.6-LUNA</text>
  </g>
