    <g transform="translate(275 22)" fill="#FF6B45"><svg width="88" height="88" viewBox="0 0 800 800"><title>Pi</title><path fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/><path d="M517.36 400H634.72V634.72H517.36Z"/></svg></g>
    <text x="26" y="51" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">ROUTE</text>
    <text x="26" y="84" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700">Pi</text>
